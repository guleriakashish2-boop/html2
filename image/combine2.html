<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIET Centralized Campus & AI Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; color: #333; }

    /* Top Navbar */
    .navbar { background-color: #0b1f3a; color: white; display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; }
    .navbar-brand { font-weight: 700; font-size: 20px; }
    .nav-btn { background-color: #1a365d; color: #e2e8f0; border: 1px solid #2b4c7e; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .nav-btn.ai-btn { background: linear-gradient(135deg, #6b46c1 0%, #3182ce 100%); color: white; border: none; }

    /* Sub Navigation */
    .sub-nav { background-color: #ffffff; padding: 12px 24px; display: flex; gap: 10px; border-bottom: 1px solid #e2e8f0; }
    .sub-btn { background-color: #edf2f7; color: #2d3748; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .sub-btn.active { background-color: #3182ce; color: white; }

    /* Main Container */
    .portal-container { display: flex; gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; }
    .left-panel { flex: 1.2; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .right-panel { flex: 0.8; display: flex; flex-direction: column; gap: 20px; }

    /* Cards */
    .dept-card, .card-box { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .dept-card h3 { font-size: 16px; margin-bottom: 14px; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }
    .dept-btn { display: block; width: 100%; background-color: #f7fafc; color: #4a5568; border: 1px solid #e2e8f0; padding: 9px; margin-bottom: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; text-align: left; }
    .dept-btn:hover { background-color: #edf2f7; color: #2b6cb0; }

    /* Action Buttons */
    .action-btn { padding: 10px 18px; border-radius: 6px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; color: white; margin-right: 8px; }
    .btn-blue { background-color: #3182ce; }
    .btn-dark { background-color: #2d3748; }

    /* AI Box Details */
    .ai-card { background: linear-gradient(180deg, #ffffff 0%, #f7fafc 100%); border: 1px solid #cbd5e0; }
    .ai-badge { background: linear-gradient(135deg, #805ad5 0%, #3182ce 100%); color: white; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px; display: inline-block; margin-bottom: 10px; }
    .ai-input-wrapper { display: flex; gap: 8px; margin-top: 10px; }
    .ai-input-wrapper input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e0; outline: none; }
    .ai-submit-btn { background: #805ad5; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
